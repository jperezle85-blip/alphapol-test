# Publica el portal en Firebase Hosting cada vez que se sube código a la rama main.
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
permissions:
  checks: write
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALPHAPOL_4FA0E }}
          channelId: live
          projectId: alphapol-4fa0e
